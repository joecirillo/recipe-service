spring:
  config:
    import: "optional:aws-parameterstore:/foodies-finds/recipe-service/"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    aws:
      region:
        static: us-west-2
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: true
    show-sql: true

api:
  keys:
    user: ${API_KEY}
    admin: ${API_KEY_ADMIN}

s3:
  bucketName: ${S3_BUCKET_NAME}
